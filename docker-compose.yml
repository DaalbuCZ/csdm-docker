services:
  db:
    image: postgres:18
    restart: unless-stopped
    container_name: csdm-postgresql
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-csdm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      # postgres:18 stores data in a versioned subdirectory, so the volume
      # must be mounted at /var/lib/postgresql (not .../data).
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d ${POSTGRES_DB:-csdm}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Dockerfile.serve
    restart: unless-stopped
    container_name: csdm-server
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-csdm}
      INBOX_DIR: /data/inbox
      API_TOKEN: ${API_TOKEN:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      STEAM_API_KEY: ${STEAM_API_KEY:-}
      TRACK_POLL_MINUTES: ${TRACK_POLL_MINUTES:-15}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      CLIP_PADDING_SECONDS: ${CLIP_PADDING_SECONDS:-6}
      CLIP_MAX_SECONDS: ${CLIP_MAX_SECONDS:-90}
    ports:
      - '${PORT:-3000}:3000'
    volumes:
      - inbox:/data/inbox
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:'' + (process.env.PORT || ''3000'') + ''/api/status'').then((r) => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))"',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  postgres-data:
  inbox:
